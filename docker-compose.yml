services:
  db:
    image: postgres:19-trixie@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    restart: unless-stopped
    environment:
      POSTGRES_USER: souvenir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: souvenir
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5566}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souvenir -d souvenir"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${APP_IMAGE:-souvenir:local}
    build: .
    command: ["node", "scripts/migrate.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://souvenir:${POSTGRES_PASSWORD:?}@db:5432/souvenir
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-souvenir:local}
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://souvenir:${POSTGRES_PASSWORD:?}@db:5432/souvenir
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The deploy's `up --wait` passes or fails on this.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/signin"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      default:
      edge:
        # `app` is ambiguous on a network shared with other projects.
        aliases:
          - souvenir

volumes:
  pgdata:

networks:
  # The reverse proxy's network; it must already exist (`docker network create edge`).
  edge:
    external: true
    name: ${DOCKER_NETWORK:-edge}
