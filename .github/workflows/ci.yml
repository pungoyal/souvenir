name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # keep in step with the Dockerfile
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Engine tests
        run: pnpm vitest run
      - name: Build
        run: pnpm build
        env:
          # Placeholder for lib/env.ts at build; the server gets its real secret from the deploy .env.
          AUTH_SECRET: insecure-build-time-placeholder

  # Beside `verify` and `stack`; `deploy` waits on all three. A pull request builds the image and
  # discards it (`stack` runs its own build); a push publishes and attests it. PUSH is that one
  # decision; every step below reads it.
  image:
    runs-on: ubuntu-24.04-arm
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase) and short-sha tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      # Reproducible where the tooling allows: build id and layer timestamps are the commit's,
      # and the image carries its sha for /privacy. A member checks the attestation with
      # `gh attestation verify oci://<image>:<tag> --owner <owner>`.
      #
      # No layer cache: `rewrite-timestamp` stamps every layer with the commit date, so nothing
      # exported is reusable and `cache-to` only cost time. Check the log for `CACHED` before
      # re-adding it.
      - name: Build the image (arm64, matching the OCI host) — pushed unless this is a PR
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/arm64
          outputs: ${{ env.PUSH == 'true' && 'type=image,push=true,rewrite-timestamp=true' || 'type=cacheonly' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # Both describe a published image; a pull request publishes nothing.
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH }}
      - name: Attest the image (Sigstore, signed with this run's OIDC identity)
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The stack as the box runs it: the compose file, the pinned Postgres, every migration from an
  # empty database, an image built from this commit's Dockerfile (the same build as `image`, not
  # the published bytes), and `--wait` until db and app report healthy. A green run is what lets
  # Renovate merge an image or database bump with nobody watching (renovate.json); `verify` never
  # starts Postgres. It does not test a migration against existing data, nor a new Postgres over
  # an old volume: the deploy's dump is the answer to those.
  stack:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start db, migrate and app from this commit
        run: |
          docker network create edge
          printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Logs
        if: failure()
        run: docker compose logs --no-color

  deploy:
    needs: [verify, image, stack]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # Everything host-specific comes from the "oracle-cloud" GitHub environment,
    # which is the single source of truth for the server's .env:
    #   vars:    SSH_HOST, SSH_USER, SSH_PORT (optional), SSH_KNOWN_HOSTS
    #            (the box's host keys, `ssh-keyscan` format — the deploy
    #            refuses a host that doesn't match), DEPLOY_DIR,
    #            APP_PORT, APP_BIND, DB_PORT, AUTH_URL, DOCKER_NETWORK
    #            (the external network the proxy shares with the app),
    #            RANKED_MIN_RESOLVED, CONTACT_EMAIL, LLM_BASE_URL, LLM_MODEL,
    #            SPEECH_BASE_URL, SPEECH_TTS_MODEL, SPEECH_GROUP_ID, SPEECH_VOICES,
    #            SPEECH_VOICE_US, SPEECH_VOICE_THEM, SPEECH_VOICE_THEM_PITCH,
    #            SPEECH_VOICE_THEM_SPEED (all optional: blank is unset, lib/env.ts)
    #   secrets: SSH_PRIVATE_KEY, POSTGRES_PASSWORD, AUTH_SECRET,
    #            AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, LLM_API_KEY,
    #            SPEECH_API_KEY (optional: one vendor, so LLM_API_KEY serves)
    # The registry pull uses this run's ephemeral GITHUB_TOKEN — no PAT needed.
    environment: oracle-cloud
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-oracle-cloud
      cancel-in-progress: false
    steps:
      # One SSH step does the whole deploy. Plain ssh, not an action: SSH_KNOWN_HOSTS pins the
      # host keys and StrictHostKeyChecking refuses anything else, so the deploy cannot be
      # redirected. The host needs no checkout. The `export %q` prelude carries the runner's env
      # across without the remote shell re-parsing it.
      - name: Deploy over SSH
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only the head of main deploys. Runs enter the deploy queue when their checks finish,
          # not in commit order, so an older run can arrive after a newer one has deployed (and
          # migrated). Checked inside the concurrency group: a newer head deploys after this.
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the head of main ($head); its own run deploys it."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            printf 'export APP_IMAGE=%q DEPLOY_DIR=%q GHCR_USER=%q GHCR_TOKEN=%q REPO=%q SHA=%q\n' \
              "$APP_IMAGE" "$DEPLOY_DIR" "$GHCR_USER" "$GHCR_TOKEN" "$REPO" "$SHA"
            cat <<'DEPLOY_SCRIPT'
          set -euo pipefail

          # DEPLOY_DIR may not exist on a fresh host; parents like /opt are root-owned, so sudo.
          if [ ! -d "$DEPLOY_DIR" ]; then
            mkdir -p "$DEPLOY_DIR" 2>/dev/null || {
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
            }
          fi
          cd "$DEPLOY_DIR"

          # The compose file comes from the deployed commit, so the host cannot drift.
          curl -fsSL \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$REPO/contents/docker-compose.yml?ref=$SHA" \
            -o docker-compose.yml

          # .env is rendered on every deploy from the oracle-cloud environment: edit there, never
          # on the server. Quoted heredoc writes values verbatim; GitHub masks secrets in the log.
          umask 077
          cat > .env <<'ENV_EOF'
          APP_PORT=${{ vars.APP_PORT }}
          APP_BIND=${{ vars.APP_BIND }}
          DB_PORT=${{ vars.DB_PORT }}
          DOCKER_NETWORK=${{ vars.DOCKER_NETWORK }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_URL=${{ vars.AUTH_URL }}
          AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_DEV_LOGIN=false
          RANKED_MIN_RESOLVED=${{ vars.RANKED_MIN_RESOLVED }}
          CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
          LLM_BASE_URL=${{ vars.LLM_BASE_URL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=${{ vars.LLM_MODEL }}
          SPEECH_BASE_URL=${{ vars.SPEECH_BASE_URL }}
          SPEECH_API_KEY=${{ secrets.SPEECH_API_KEY || secrets.LLM_API_KEY }}
          SPEECH_TTS_MODEL=${{ vars.SPEECH_TTS_MODEL }}
          SPEECH_GROUP_ID=${{ vars.SPEECH_GROUP_ID }}
          SPEECH_VOICES=${{ vars.SPEECH_VOICES }}
          SPEECH_VOICE_US=${{ vars.SPEECH_VOICE_US }}
          SPEECH_VOICE_THEM=${{ vars.SPEECH_VOICE_THEM }}
          SPEECH_VOICE_THEM_PITCH=${{ vars.SPEECH_VOICE_THEM_PITCH }}
          SPEECH_VOICE_THEM_SPEED=${{ vars.SPEECH_VOICE_THEM_SPEED }}
          ENV_EOF

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export APP_IMAGE
          docker compose pull --quiet

          # A restore point before anything moves: migrations are forward-only and a new Postgres
          # digest replaces the db container. Where there is data there is a dump, or no deploy;
          # only a host with no data volume yet skips it. Kept 30 days, by age not count, so
          # retries of a failing deploy cannot push the last good restore point out.
          mkdir -p backups
          project="$(docker compose config | sed -n 's/^name: //p')"
          if docker volume inspect "${project}_pgdata" >/dev/null 2>&1; then
            if [ -z "$(docker compose ps --all --quiet db)" ]; then
              echo "data volume ${project}_pgdata exists but no db container does, so there is" >&2
              echo "nothing safe to dump from. Start db on its old image by hand, then re-run." >&2
              exit 1
            fi
            # On the image it already runs: --no-recreate leaves a new digest for later.
            docker compose up -d --no-recreate --no-deps --wait db
            dump="backups/$(date -u +%Y%m%dT%H%M%SZ)-${SHA::7}.dump"
            if ! docker compose exec -T db pg_dump -U souvenir -Fc souvenir > "$dump.partial"; then
              rm -f "$dump.partial"
              echo "pg_dump failed; nothing was deployed." >&2
              exit 1
            fi
            mv "$dump.partial" "$dump"
            find backups -name '*.dump' -mtime +30 -delete
            echo "restore point: $DEPLOY_DIR/$dump"
          fi

          # The release, in the order that keeps the old app serving for as long as possible.
          # 1. Postgres alone: a new digest replaces the container here (seconds), data volume kept.
          docker compose up -d --no-build --no-deps --wait db

          # 2. Migrations, while the old app still serves. Drizzle applies every pending one in a
          #    single transaction, so a failure leaves the schema as it was and the old app up.
          if ! docker compose run --rm --no-deps migrate; then
            echo "migration failed and rolled back; the previous build is still serving." >&2
            exit 1
          fi

          # 3. The new app (`migrate` runs again inside `up`, with nothing left to apply). `--wait`
          #    returns once the app's healthcheck fetches /signin, so a boot-then-crash fails the
          #    deploy; by then the old app is gone and the schema is migrated.
          if ! docker compose up -d --no-build --wait --wait-timeout 180; then
            echo "the new app never came up healthy, and the old one is stopped; last 50 log lines:" >&2
            docker compose logs --tail=50 app >&2
            exit 1
          fi

          docker image prune -f
          docker compose ps
          DEPLOY_SCRIPT
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$SSH_USER@$SSH_HOST" bash -s
