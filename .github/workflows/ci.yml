name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Tests
        run: pnpm vitest run

  # The only `next build` in CI. Every run builds; only `main` pushes and attests.
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      # /privacy promises this.
      - name: Attest the image
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [verify, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: oracle-cloud
    permissions:
      contents: read
      packages: read
    concurrency: deploy-oracle-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A blank value is unset (lib/env.ts).
      - name: Render .env
        run: |
          umask 077
          cat > .env <<'ENV_EOF'
          APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          DOCKER_NETWORK=${{ vars.DOCKER_NETWORK }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_URL=${{ vars.AUTH_URL }}
          AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_DEV_LOGIN=false
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          RANKED_MIN_RESOLVED=${{ vars.RANKED_MIN_RESOLVED }}
          CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
          FX_BASE_URL=${{ vars.FX_BASE_URL }}
          LLM_BASE_URL=${{ vars.LLM_BASE_URL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=${{ vars.LLM_MODEL }}
          SPEECH_BASE_URL=${{ vars.SPEECH_BASE_URL }}
          SPEECH_API_KEY=${{ secrets.SPEECH_API_KEY || secrets.LLM_API_KEY }}
          SPEECH_TTS_MODEL=${{ vars.SPEECH_TTS_MODEL }}
          SPEECH_GROUP_ID=${{ vars.SPEECH_GROUP_ID }}
          SPEECH_VOICES=${{ vars.SPEECH_VOICES }}
          SPEECH_VOICE_US=${{ vars.SPEECH_VOICE_US }}
          SPEECH_VOICE_THEM=${{ vars.SPEECH_VOICE_THEM }}
          SPEECH_VOICE_THEM_PITCH=${{ vars.SPEECH_VOICE_THEM_PITCH }}
          SPEECH_VOICE_THEM_SPEED=${{ vars.SPEECH_VOICE_THEM_SPEED }}
          ENV_EOF
      - name: Copy both files to the box and compose up
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host box
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          scp docker-compose.yml .env "box:$DEPLOY_DIR/"
          ssh box "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin" <<< "$GHCR_TOKEN"
          ssh box "cd '$DEPLOY_DIR' && IMAGE='$IMAGE' SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          docker compose pull -q app
          docker compose up -d --no-build --wait app || { docker compose logs --tail=50 migrate app >&2; exit 1; }
          docker compose ps
          # Remove the images of earlier deploys.
          docker images --format '{{.Repository}}:{{.Tag}}' "$IMAGE" | grep -v ":$SHA$" | xargs -r docker rmi || true
          REMOTE
