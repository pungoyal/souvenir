name: Renovate fixup

# Some updates want the repository changed with them: a new Biome reformats files and migrates
# biome.json. The hosted Renovate cannot run commands, so this does, on its branches only, and
# commits what changed. A push made with GITHUB_TOKEN starts no workflow, so the required checks
# are started here by hand on the new commit. A new tool that needs the same goes in `Fix`.

on:
  push:
    branches: ["renovate/**"]

permissions:
  contents: write
  actions: write

jobs:
  fixup:
    # Not on our own commit, should a token ever start one.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Fix
        run: |
          pnpm biome migrate --write
          pnpm biome check --write . || true # what it cannot fix is for `verify` to report
      - name: Commit what changed and start the checks on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Fixes the update asks for"
          git push
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
